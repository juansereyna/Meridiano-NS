name: Barrida Meridiano

# Barrida automática: 6:45 a. m. y 12:45 p. m. hora de Bogotá (UTC-5).
# GitHub puede demorar unos minutos el inicio de las ejecuciones programadas.
# Sella cada barrida como un lote con la LLAVE PÚBLICA: no usa la clave de Meridiano.
# Necesita solo el secreto ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
# Mientras el secreto no exista, la ejecución termina sin hacer nada y sin error.
on:
  schedule:
    - cron: "45 11 * * *"
    - cron: "45 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barrida-meridiano
  cancel-in-progress: false

jobs:
  barrida:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Comprobar secreto
        id: secreto
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Falta el secreto ANTHROPIC_API_KEY. La barrida no se ejecuta hasta que se cree."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.secreto.outputs.ok == 'si'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.secreto.outputs.ok == 'si'
        with:
          python-version: "3.12"

      - if: steps.secreto.outputs.ok == 'si'
        run: pip install cryptography==43.0.3

      - name: Ejecutar barrida
        if: steps.secreto.outputs.ok == 'si'
        id: barrida
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MERIDIANO_MODELO: ${{ vars.MERIDIANO_MODELO }}
          MERIDIANO_BUSQUEDAS: ${{ vars.MERIDIANO_BUSQUEDAS }}
        run: python3 tools/barrida.py

      - name: Publicar
        if: steps.secreto.outputs.ok == 'si'
        env:
          RESUMEN: ${{ steps.barrida.outputs.resumen }}
        run: |
          git add data/lotes.json data/lotes data/memoria.enc.json
          if git diff --cached --quiet; then echo "Sin cambios que publicar."; exit 0; fi
          git -c user.name="Meridiano" -c user.email="noreply@anthropic.com" commit -q -m "Barrida $(TZ=America/Bogota date +'%Y-%m-%d %H:%M') · $RESUMEN"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::No se pudo publicar la barrida"; exit 1
