name: Barrida Meridiano

# 6:45 a. m. y 12:45 p. m. hora de Bogotá (UTC-5). GitHub puede demorar
# unos minutos el inicio de las ejecuciones programadas.
# Horario PAUSADO: requiere el secreto ANTHROPIC_API_KEY (API de pago).
# Para activarlo, cree los secretos y quite el "#" de las tres líneas de schedule.
on:
  # schedule:
  #   - cron: "45 11 * * *"
  #   - cron: "45 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: barrida-meridiano
  cancel-in-progress: false

jobs:
  barrida:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        env:
          MERIDIANO_CLAVE: ${{ secrets.MERIDIANO_CLAVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          faltan=""
          [ -z "$MERIDIANO_CLAVE" ] && faltan="$faltan MERIDIANO_CLAVE"
          [ -z "$ANTHROPIC_API_KEY" ] && faltan="$faltan ANTHROPIC_API_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos del repositorio:$faltan (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography==43.0.3

      - name: Ejecutar barrida
        id: barrida
        env:
          MERIDIANO_CLAVE: ${{ secrets.MERIDIANO_CLAVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MERIDIANO_MODELO: ${{ vars.MERIDIANO_MODELO }}
          MERIDIANO_BUSQUEDAS: ${{ vars.MERIDIANO_BUSQUEDAS }}
        run: python3 tools/barrida.py

      - name: Publicar
        env:
          RESUMEN: ${{ steps.barrida.outputs.resumen }}
        run: |
          if git diff --quiet -- data/alertas.enc.json; then
            echo "Sin cambios que publicar."; exit 0
          fi
          git config user.name "Meridiano"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alertas.enc.json
          git commit -m "Barrida $(TZ=America/Bogota date +'%Y-%m-%d %H:%M') · $RESUMEN"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          echo "::error::No se pudo publicar la barrida"; exit 1
