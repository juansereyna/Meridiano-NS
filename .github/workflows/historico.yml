name: Histórico oficial Meridiano

# Descarga las cifras oficiales (MinDefensa y Policía, datos.gov.co) desde 2022,
# las valida y las sella con la llave pública. No usa la clave ni la API de Claude.
# Corre el día 5 de cada mes, cuando se cambia el script, o a mano desde Actions.
on:
  schedule:
    - cron: "17 13 5 * *"
  push:
    branches: [main]
    paths:
      - tools/historico.py
      - .github/workflows/historico.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historico-meridiano
  cancel-in-progress: false

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install cryptography==43.0.3

      - name: Descargar y sellar cifras oficiales
        run: python3 tools/historico.py data

      - name: Publicar
        if: always()
        run: |
          git add data/historico.enc.json data/historico.resumen.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git -c user.name="Meridiano" -c user.email="noreply@anthropic.com" commit -m "Histórico oficial actualizado"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin main && break; sleep 5; done
